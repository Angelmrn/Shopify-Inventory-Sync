services:
  db:
    image: postgres:17
    container_name: inventory_sync_db
    environment:
      POSTGRES_DB: inventory_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_sync_backend
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/inventory_sync
      - SHOPIFY_STORE=${SHOPIFY_STORE}
      - SHOPIFY_ADMIN_TOKEN=${SHOPIFY_ADMIN_TOKEN}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory_sync_frontend
    command: pnpm dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    depends_on:
      - backend
  adminer:
    image: adminer
    container_name: inventory_sync_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  postgres_data:
