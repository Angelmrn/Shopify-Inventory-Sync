services:
  db:
    image: postgres:17
    container_name: inventory_sync_db
    environment:
      POSTGRES_DB: inventory_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 5

  backend:
    build: .
    container_name: inventory_sync_backend
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/inventory_sync
      - SHOPIFY_STORE=${SHOPIFY_STORE}
      - SHOPIFY_ADMIN_TOKEN=${SHOPIFY_ADMIN_TOKEN}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
  adminer:
    image: adminer
    container_name: inventory_sync_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  postgres_data:
